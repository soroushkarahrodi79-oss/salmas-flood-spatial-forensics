[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "salmas-flood-spatial-forensics"
version = "0.1.0"
description = "Reproducible open spatial forensics for the 22 October 2026 Salmas flash flood"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Soroush Karahrodi"}]

[tool.setuptools.packages.find]
where = ["src"]

